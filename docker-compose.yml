services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clinicbrain
      POSTGRES_PASSWORD: clinicbrain
      POSTGRES_DB: clinicbrain
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicbrain"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clinicbrain
      MINIO_ROOT_PASSWORD: clinicbrain-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc
    depends_on: [minio]
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 clinicbrain clinicbrain-secret; do sleep 2; done;
      mc mb -p local/clinicbrain-docs || true;
      "

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://clinicbrain:clinicbrain@db:5432/clinicbrain
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["18000:8000"]
    volumes: ["./backend:/app", "/app/.venv"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://clinicbrain:clinicbrain@db:5432/clinicbrain
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    command: uv run celery -A app.workers.celery_app:celery_app worker -l info
    volumes: ["./backend:/app", "/app/.venv"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://clinicbrain:clinicbrain@db:5432/clinicbrain
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    command: uv run celery -A app.workers.celery_app:celery_app beat -l info
    volumes: ["./backend:/app", "/app/.venv"]
    depends_on:
      redis: {condition: service_started}

  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
